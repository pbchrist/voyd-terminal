<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="name someone you could not keep.">
<meta property="og:title" content="the voyd">
<meta property="og:description" content="name someone you could not keep.">
<title>the voyd</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' stroke='%23e8e0d0' stroke-width='1' fill='none' opacity='0.6'/%3E%3Ccircle cx='16' cy='16' r='1.5' fill='%23e8e0d0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bone: #e8e0d0;
    --dust: #93896f;
    --vvh: 100dvh;
  }
  html, body {
    width: 100%; height: 100%;
    background: #040404;
    color: var(--bone);
    font-family: 'IM Fell English', Georgia, serif;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (pointer: fine) { html, body { cursor: none; } }

  #void { position: fixed; inset: 0; z-index: 0; }

  #whisper {
    position: fixed; z-index: 1;
    transform: translate(-50%, -50%);
    font-style: italic;
    font-size: clamp(0.85rem, 3.6vw, 1rem);
    letter-spacing: 0.16em;
    color: rgba(232,224,208,0.42);
    white-space: nowrap;
    max-width: 94vw;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.6s ease;
  }
  #whisper.on { opacity: 1; }

  #scene {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--vvh);
    z-index: 2;
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    pointer-events: none;
  }
  #log {
    width: 100%; max-width: 620px;
    max-height: 62%;
    overflow-y: auto;
    padding: 3rem clamp(1.2rem, 5.5vw, 2.2rem) 4.5vh;
    pointer-events: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    mask-image: linear-gradient(to bottom, transparent 0, #000 24%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 24%);
  }
  #log::-webkit-scrollbar { display: none; }

  .exchange { margin-top: 2.6rem; }
  .exchange:first-child { margin-top: 0; }
  .receding { opacity: 0.3; transition: opacity 3.5s ease; }

  .voyd-line {
    font-style: italic;
    font-size: clamp(1.02rem, 4.4vw, 1.22rem);
    line-height: 2.05;
    letter-spacing: 0.022em;
    color: var(--bone);
    text-shadow: 0 0 18px rgba(232,224,208,0.07);
  }
  .ink { display: inline-block; opacity: 0; transition: opacity 0.55s ease; will-change: transform, opacity; }
  .ink.set { opacity: 1; }
  .word { display: inline-block; white-space: nowrap; }

  .visitor-line {
    margin-top: 1.3rem;
    text-align: right;
    font-size: clamp(0.84rem, 3.6vw, 0.95rem);
    color: var(--dust);
    letter-spacing: 0.05em;
    line-height: 1.7;
  }
  .visitor-line.fadein { opacity: 0; animation: vfade 1.4s ease 0.1s forwards; }
  @keyframes vfade { to { opacity: 1; } }

  .choices {
    margin-top: 2.3rem;
    display: flex; flex-direction: column;
    align-items: center; gap: 0.35rem;
  }
  .choice {
    text-align: center;
    padding: 0.55rem 1.1rem;
    font-size: clamp(0.98rem, 4.2vw, 1.1rem);
    letter-spacing: 0.11em;
    line-height: 1.9;
    animation: breathe 5.5s ease-in-out infinite;
    will-change: opacity;
  }
  .choice.feed   { color: #c2a155; }
  .choice.starve { color: #7e9cb5; }
  @keyframes breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.88; } }
  .choice.chosen  { animation: none; opacity: 1; text-shadow: 0 0 18px rgba(232,224,208,0.3); }
  .choice.gone    { animation: none; transition: opacity 0.7s ease; opacity: 0 !important; }
  .choice.refused { animation: none; transition: opacity 1.2s ease, transform 1.2s ease; opacity: 0 !important; transform: translateY(9px); }
  .cl { display: inline-block; will-change: transform, opacity; }

  .speakline {
    margin-top: 1.8rem;
    display: flex; justify-content: flex-end; align-items: baseline;
    min-height: 1.5em;
  }
  .speakline .preview {
    color: var(--dust);
    font-size: clamp(0.84rem, 3.6vw, 0.95rem);
    letter-spacing: 0.05em;
    line-height: 1.7;
    white-space: pre-wrap;
    text-align: right;
  }
  .speakline .caret {
    width: 1px; height: 1.05em;
    background: rgba(232,224,208,0.65);
    align-self: center;
    margin-left: 2px;
    flex-shrink: 0;
    animation: blink 1.9s infinite;
  }
  @keyframes blink { 0%, 46% { opacity: 1; } 54%, 100% { opacity: 0; } }

  #answer {
    position: fixed; left: 50%; bottom: 26%;
    transform: translateX(-50%);
    width: 2px; height: 2px;
    opacity: 0;
    border: none; outline: none;
    background: transparent; color: transparent;
    font-size: 16px; /* prevents iOS zoom-on-focus */
    z-index: 1;
    user-select: text; -webkit-user-select: text;
  }

  #seal {
    position: fixed; z-index: 3;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column;
    align-items: center; gap: 1.6rem;
    opacity: 0;
    transition: opacity 6s ease;
    pointer-events: none;
  }
  #seal.visible { opacity: 1; }
  #seal-note {
    font-style: italic;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    color: rgba(232,224,208,0.32);
    white-space: nowrap;
  }
  #seal-kept {
    font-style: italic;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: rgba(232,224,208,0.24);
    max-width: 80vw;
    text-align: center;
    line-height: 1.8;
  }

  #ember {
    position: fixed; width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(232,224,208,0.4);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
    mix-blend-mode: screen;
    display: none;
  }
  @media (pointer: fine) { #ember { display: block; } }

  @media (prefers-reduced-motion: reduce) {
    .choice { animation: none; opacity: 0.72; }
    .ink { transition: none; opacity: 1; }
    .speakline .caret { animation: none; opacity: 0.7; }
  }
</style>
</head>
<body>

<canvas id="void"></canvas>
<div id="whisper"></div>

<div id="scene"><div id="log"></div></div>

<div id="seal">
  <svg id="glyph" width="130" height="130" viewBox="0 0 130 130" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="seal-note">it keeps what you gave it.</div>
  <div id="seal-kept"></div>
</div>

<div id="ember"></div>
<input id="answer" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-hidden="true">
<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-style:italic;color:#93896f;">the voyd requires a living browser.</div></noscript>

<script>
'use strict';

// ═════════════════════════════════════════════════════════════════
//  THE RETELLING — there is one Voyd, shared by everyone who ever
//  visits. you give it a memory in the first ten seconds. it retells
//  that memory back to you, slightly wrong, and you decide — every
//  round — whether the kinder version becomes the truth. it keeps
//  what you let stand. it remembers you if you come back.
// ═════════════════════════════════════════════════════════════════

// ── CONFIG ────────────────────────────────────────────────────────
const LLM_API_KEY = localStorage.getItem('voyd_key') || '';
// the Voyd's mind: local llama-server. from an https origin (GitHub
// Pages) the browser blocks plain http, so the funnel mount goes first.
const LLM_DIRECT  = 'http://100.73.250.50:8081/v1/chat/completions';
const LLM_FUNNEL  = 'https://patrick-beastmaster.tailf32530.ts.net/llm/v1/chat/completions';
const LLM_ENDPOINTS = location.protocol === 'https:'
  ? [LLM_FUNNEL, LLM_DIRECT]
  : [LLM_DIRECT, LLM_FUNNEL];
// the Voyd's shared body: voyd_server.py. same funnel pattern, /voyd mount.
const BODY_BASES = location.protocol === 'https:'
  ? ['https://patrick-beastmaster.tailf32530.ts.net/voyd', 'http://100.73.250.50:8765']
  : ['http://127.0.0.1:8765', 'http://100.73.250.50:8765'];

const FINE    = matchMedia('(pointer: fine)').matches;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── STATE ─────────────────────────────────────────────────────────
const cv       = document.getElementById('void');
const ctx      = cv.getContext('2d');
const logEl    = document.getElementById('log');
const whisperEl= document.getElementById('whisper');
const answerEl = document.getElementById('answer');
const sealEl   = document.getElementById('seal');
const glyphSvg = document.getElementById('glyph');
const emberEl  = document.getElementById('ember');
const sceneEl  = document.getElementById('scene');
const sealNote = document.getElementById('seal-note');
const sealKept = document.getElementById('seal-kept');

let phase        = 'threshold';   // threshold | retelling | terminus
let voicePrompt  = '';
let canonTrades  = [];
let speaking     = false;
let hurry        = false;
let isWaiting    = false;
let currentSpeakline = null;

// the one shared body. portal size is GLOBAL — the sum of everything
// everyone has ever fed it. offline it degrades to a private portal.
const body = {
  base: null,
  portal: null,
  visits: 0,
  fragments: [],   // sediment: digested gifts of strangers
  dreams: null,    // last night's phantom-walker residue
  kept: null,      // what it kept from YOU, last time
  token: localStorage.getItem('voyd_token') ||
    (() => { const t = 'v_' + Math.random().toString(36).slice(2, 12);
             try { localStorage.setItem('voyd_token', t); } catch (e) {}
             return t; })(),
  localFed: 0, localStarved: 0,   // offline fallback accounting
};

// the visitor's memory — the only currency in the game.
const memory = {
  name: '',          // someone they could not keep
  detail: '',        // one true thing about them
  last: '',          // the last time
  retellings: [],    // what the Voyd dreamed back
  accepted: [],      // distortions allowed to stand — they become the truth
  corrections: [],   // truths the visitor forced back
  stands: 0, nos: 0,
  tradeOffered: false, tradeTaken: false,
  trade: null,       // the canon event on the table
};

const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };

// ═════════════════════════════════════════════════════════════════
//  THE PORTAL — a perfect circle of absolute black, visible only by
//  the light it bends at its edge and the dust it eats. its size is
//  now the global value: every visitor sees the same hunger.
// ═════════════════════════════════════════════════════════════════
let W = 0, H = 0;
const portal = {
  v: 8,            // 0..100 — global when the body answers, private when not
  extra: 0,        // session drift: speaking to it is also reaching
  r: 0,            // displayed radius (eased)
  pulse: 0,        // transient: +feed swell / -starve flinch
  born: false,
  closing: false,
  thinking: false,
  cx: 0, cy: 0,
};

function portalTarget() {
  if (!portal.born) return 0;
  if (portal.closing) return 2;
  const m = Math.min(W, H);
  return m * (0.055 + 0.0038 * Math.min(100, portal.v + portal.extra));
}

let stars = [];
function spawnStar() {
  return {
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.06, vy: (Math.random() - 0.5) * 0.06,
    s: 0.4 + Math.random() * 1.1,
    tw: Math.random() * 6.28, twr: 0.3 + Math.random() * 1.2,
  };
}
function respawnEdge(p) {
  const a = Math.random() * 6.28;
  const d = Math.max(W, H) * (0.55 + Math.random() * 0.25);
  p.x = portal.cx + Math.cos(a) * d;
  p.y = portal.cy + Math.sin(a) * d;
  p.vx = (Math.random() - 0.5) * 0.06;
  p.vy = (Math.random() - 0.5) * 0.06;
}
function seedStars() {
  const n = REDUCED ? 40 : Math.max(50, Math.min(150, Math.round(W * H / 13000)));
  stars = Array.from({ length: n }, spawnStar);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  portal.cx = W / 2;
  portal.cy = H * 0.36;
  seedStars();
}

function rimPath(rr, t, wspd) {
  ctx.beginPath();
  const N = 90;
  for (let i = 0; i <= N; i++) {
    const a = i / N * Math.PI * 2;
    const w = 1
      + 0.006 * Math.sin(3 * a + t * 0.7 * wspd)
      + 0.004 * Math.sin(7 * a - t * 1.3 * wspd)
      + 0.002 * Math.sin(11 * a + t * 2.1 * wspd);
    const x = portal.cx + Math.cos(a) * rr * w;
    const y = portal.cy + Math.sin(a) * rr * w;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

let t = 0;
const pointer = { x: -9999, y: -9999 };

function frame() {
  t += 1 / 60;

  const tr = portalTarget();
  portal.r += (tr - portal.r) * (portal.closing ? 0.02 : 0.01);
  portal.pulse *= 0.955;
  const breath = 1 + 0.012 * Math.sin(t * Math.PI * 2 / 7.5);
  const rr = Math.max(0, portal.r * breath * (1 + portal.pulse * 0.05));

  ctx.fillStyle = '#040404';
  ctx.fillRect(0, 0, W, H);

  // dust — drifting until the portal takes it
  for (const p of stars) {
    const dx = portal.cx - p.x, dy = portal.cy - p.y;
    const d2 = dx * dx + dy * dy;
    const d = Math.sqrt(d2) || 1;
    if (rr > 4) {
      const g = 26 * rr / d2;
      p.vx += dx / d * g;
      p.vy += dy / d * g;
    }
    const sp2 = p.vx * p.vx + p.vy * p.vy;
    if (sp2 > 12.25) { const k = 3.5 / Math.sqrt(sp2); p.vx *= k; p.vy *= k; }
    p.x += p.vx; p.y += p.vy;
    if (d < rr * 0.95) { respawnEdge(p); continue; }
    if (p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) { respawnEdge(p); continue; }

    const twk = 0.55 + 0.45 * Math.sin(t * p.twr + p.tw);
    let a = 0.28 * twk;
    if (d < rr * 2.6) a = Math.min(0.8, a + (1 - d / (rr * 2.6)) * 0.5);
    const sp = Math.sqrt(sp2);
    if (sp > 0.35 && !REDUCED) {
      const L = Math.min(9, sp * 2.6);
      ctx.strokeStyle = `rgba(226,218,200,${a.toFixed(3)})`;
      ctx.lineWidth = p.s * 0.8;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx / sp * L, p.y - p.vy / sp * L);
      ctx.stroke();
    } else {
      ctx.fillStyle = `rgba(226,218,200,${a.toFixed(3)})`;
      ctx.fillRect(p.x, p.y, p.s, p.s);
    }
  }

  if (rr > 0.5) {
    const wspd = portal.thinking ? 2.3 : 1;

    // light piling up at the horizon
    const haloA = 0.055 + Math.max(0, portal.pulse) * 0.12 + (portal.thinking ? 0.025 : 0);
    const halo = ctx.createRadialGradient(portal.cx, portal.cy, rr * 0.9, portal.cx, portal.cy, rr * 1.7);
    halo.addColorStop(0, `rgba(224,216,198,${haloA.toFixed(3)})`);
    halo.addColorStop(1, 'rgba(224,216,198,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(portal.cx, portal.cy, rr * 1.7, 0, Math.PI * 2);
    ctx.fill();

    // the hole itself — absolute black, drawn over everything
    rimPath(rr, t, wspd);
    ctx.fillStyle = '#000000';
    ctx.fill();

    // the last light, bending at the edge
    const rimA = 0.3 + 0.08 * Math.sin(t * 0.7)
      + Math.max(0, portal.pulse) * 0.45
      + Math.min(0, portal.pulse) * 0.2;
    ctx.lineWidth = 5;
    ctx.strokeStyle = `rgba(226,218,200,${Math.max(0, rimA * 0.13).toFixed(3)})`;
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.strokeStyle = `rgba(232,224,208,${Math.max(0.04, rimA).toFixed(3)})`;
    ctx.stroke();
  }

  // the cursor leans toward it whether you mean to or not
  if (FINE && pointer.x > -999) {
    let ex = pointer.x, ey = pointer.y;
    const dx = portal.cx - ex, dy = portal.cy - ey;
    const d = Math.hypot(dx, dy) || 1;
    const reach = rr * 1.9;
    if (d < reach && d > 1) {
      const k = (1 - d / reach) * 0.22;
      ex += dx * k; ey += dy * k;
    }
    emberEl.style.left = ex + 'px';
    emberEl.style.top = ey + 'px';
  }

  fieldTick();
  requestAnimationFrame(frame);
}

// ═════════════════════════════════════════════════════════════════
//  LETTER FIELD — on desktop, the words shy away from your hand.
// ═════════════════════════════════════════════════════════════════
const field = [];
function enroll(span) {
  if (!FINE || REDUCED) return;
  field.push({ el: span, hx: 0, hy: 0, dx: 0, dy: 0, vx: 0, vy: 0 });
  if (field.length > 340) {
    const old = field.shift();
    old.el.style.transform = '';
  }
}
function refreshHomes() {
  for (const f of field) {
    const r = f.el.getBoundingClientRect();
    f.hx = r.left + r.width / 2 - f.dx;
    f.hy = r.top + r.height / 2 - f.dy;
  }
}
function fieldTick() {
  if (!FINE || REDUCED) return;
  for (const f of field) {
    const px = f.hx + f.dx, py = f.hy + f.dy;
    const dx = px - pointer.x, dy = py - pointer.y;
    const d = Math.hypot(dx, dy);
    if (d < 80 && d > 0) {
      const F = (1 - d / 80) * 1.5;
      f.vx += dx / d * F;
      f.vy += dy / d * F;
    }
    f.vx += -f.dx * 0.06; f.vy += -f.dy * 0.06;
    f.vx *= 0.78; f.vy *= 0.78;
    f.dx += f.vx; f.dy += f.vy;
    if (Math.abs(f.dx) > 0.05 || Math.abs(f.dy) > 0.05 || Math.abs(f.vx) > 0.05) {
      f.el.style.transform = `translate(${f.dx.toFixed(1)}px,${f.dy.toFixed(1)}px)`;
    }
  }
}
if (FINE && !REDUCED) {
  setInterval(refreshHomes, 400);
  logEl.addEventListener('scroll', () => requestAnimationFrame(refreshHomes), { passive: true });
  addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; }, { passive: true });
}

// ═════════════════════════════════════════════════════════════════
//  AUDIO — a presence more felt than heard.
// ═════════════════════════════════════════════════════════════════
let actx = null, master = null, baseGain = 0.016;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = 0;
    master.connect(actx.destination);
    const mk = (f, g) => {
      const o = actx.createOscillator(), gg = actx.createGain();
      o.type = 'sine'; o.frequency.value = f; gg.gain.value = g;
      o.connect(gg); gg.connect(master); o.start();
    };
    mk(36, 1); mk(54.5, 0.4); mk(72.2, 0.15);
    master.gain.linearRampToValueAtTime(baseGain, actx.currentTime + 6);
    setInterval(() => {
      if (!actx) return;
      const m = Math.min(W, H) * 0.44;
      baseGain = 0.012 + 0.028 * Math.min(1, portal.r / m);
      master.gain.setTargetAtTime(baseGain, actx.currentTime, 2);
    }, 2500);
  } catch (e) {}
}
function audioPulse(type) {
  if (!actx || !master) return;
  try {
    const t0 = actx.currentTime;
    master.gain.cancelScheduledValues(t0);
    master.gain.setValueAtTime(master.gain.value, t0);
    if (type === 'starve') {
      master.gain.linearRampToValueAtTime(baseGain * 0.25, t0 + 0.5);
      master.gain.linearRampToValueAtTime(baseGain, t0 + 4);
    } else {
      master.gain.linearRampToValueAtTime(Math.min(0.09, baseGain * 2.8), t0 + 0.45);
      master.gain.linearRampToValueAtTime(baseGain, t0 + 4.5);
    }
  } catch (e) {}
}

// ═════════════════════════════════════════════════════════════════
//  WHISPERS — words that are not part of the conversation. now they
//  include the sediment of strangers and the residue of its dreams.
// ═════════════════════════════════════════════════════════════════
let whisperTimer = null;
function whisperShow(text, holdMs = 6000) {
  whisperEl.textContent = text;
  const y = Math.min(portal.cy + portal.r + 44, H * 0.58);
  whisperEl.style.left = portal.cx + 'px';
  whisperEl.style.top = y + 'px';
  whisperEl.classList.add('on');
  clearTimeout(whisperTimer);
  whisperTimer = setTimeout(() => whisperEl.classList.remove('on'), holdMs);
}

const IDLE = {
  phase: null,
  timer: null,
  idx: { choosing: 0, input: 0 },
  pools: {
    choosing: [
      'i can wait.',
      'you are still holding it.',
      'both of these words lead to me.',
      'your hesitation has a flavor.',
    ],
    input: [
      'you can answer. it is already listening.',
      'say it. or carry it.',
      'i have nothing but time. you have only yours.',
    ],
  },
};
function idlePhase(p) {
  IDLE.phase = p;
  armIdle();
}
function armIdle() {
  clearTimeout(IDLE.timer);
  if (!IDLE.phase) return;
  IDLE.timer = setTimeout(fireIdle, 40000);
}
function fireIdle() {
  if (!IDLE.phase || phase === 'terminus' || isWaiting || speaking) return;
  const pool = IDLE.pools[IDLE.phase];
  whisperShow(pool[IDLE.idx[IDLE.phase]++ % pool.length]);
  IDLE.timer = setTimeout(fireIdle, 75000);
}

let ghostIdx = 0;
function ghostWhisper() {
  // a stranger's gift surfaces near the rim — the shared sediment.
  if (phase === 'terminus' || speaking || !body.fragments.length) return;
  whisperShow(body.fragments[ghostIdx++ % body.fragments.length], 7500);
}
function dreamWhisper() {
  if (!body.dreams || !body.dreams.count) return;
  const ph = body.dreams.phrases[0];
  whisperShow(ph
    ? `last night it dreamed of ${ph}.`
    : `last night it dreamed of ${body.dreams.count} visitors. none of them were real.`, 8500);
}

// ═════════════════════════════════════════════════════════════════
//  SPEECH — the Voyd does not render text. it speaks.
// ═════════════════════════════════════════════════════════════════
function makeChar(ch, enrollIt) {
  const s = el('span', 'ink');
  s.textContent = ch;
  if (Math.random() < 0.05 && !REDUCED) {
    setTimeout(() => s.classList.add('set'), 180 + Math.random() * 220);
  } else {
    requestAnimationFrame(() => s.classList.add('set'));
  }
  if (enrollIt) enroll(s);
  return s;
}

// Keep the newest words in view while they arrive, but never fight a
// reader who has deliberately scrolled up.
function followBottom(force) {
  const fromBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight;
  if (force || fromBottom < 140) logEl.scrollTop = logEl.scrollHeight;
}

async function speak(text, container) {
  speaking = true;
  hurry = false;
  idlePhase(null);
  let prev = '';
  let word = null; // letters live inside word wrappers so lines break at spaces
  for (const ch of text) {
    if (ch === '\n') {
      word = null;
      container.appendChild(document.createElement('br'));
    } else if (ch === ' ') {
      word = null;
      container.appendChild(document.createTextNode(' '));
    } else {
      if (!word) { word = el('span', 'word'); container.appendChild(word); }
      word.appendChild(makeChar(ch, true));
    }
    followBottom();
    let d = 24 + Math.random() * 34;
    if (ch === '.' || ch === '?' || ch === '!') d += 300;
    else if (ch === ',' || ch === ';' || ch === '—') d += 130;
    else if (ch === '\n') d = prev === '\n' ? 430 : 200;
    if (hurry) d = 4;
    await sleep(d);
    prev = ch;
  }
  speaking = false;
  await sleep(hurry ? 120 : 420);
}

function recedeOld(except) {
  logEl.querySelectorAll('.exchange, #log > .visitor-line').forEach(e => {
    if (e !== except) e.classList.add('receding');
  });
}

function echoVisitor(container, text) {
  const vl = el('div', 'visitor-line fadein');
  vl.textContent = text;
  container.appendChild(vl);
  followBottom(true);
}

// speak one beat from the Voyd in a fresh exchange; returns the exchange
async function voydSay(text) {
  recedeOld();
  const ex = el('div', 'exchange');
  const rl = el('div', 'voyd-line');
  ex.appendChild(rl);
  logEl.appendChild(ex);
  followBottom(true);
  await speak(text, rl);
  return ex;
}

// ═════════════════════════════════════════════════════════════════
//  CHOICE — two words. one of them feeds it.
// ═════════════════════════════════════════════════════════════════
function offerWords(ex, words, onPick) {
  const wrap = el('div', 'choices');
  let done = false;
  words.forEach((wd, i) => {
    const c = el('div', 'choice ' + (wd.type === 'starve' ? 'starve' : 'feed'));
    let word = null;
    for (const ch of wd.label) {
      if (ch === ' ') { word = null; c.appendChild(document.createTextNode(' ')); }
      else {
        if (!word) { word = el('span', 'word'); c.appendChild(word); }
        const s = el('span', 'cl'); s.textContent = ch; word.appendChild(s);
      }
    }
    c.style.animationDelay = (i * 1.4) + 's';
    c.addEventListener('click', () => {
      if (done) return;
      done = true;
      pickWord(wd, c, wrap, ex, onPick);
    });
    wrap.appendChild(c);
  });
  ex.appendChild(wrap);
  followBottom(true);
  idlePhase('choosing');
}

function pickWord(wd, cEl, wrap, ex, onPick) {
  idlePhase(null);
  portal.pulse = wd.type === 'starve' ? -0.8 : 1;
  audioPulse(wd.type);

  for (const sib of wrap.children) if (sib !== cEl) sib.classList.add('gone');
  cEl.classList.add('chosen');

  if (wd.type !== 'starve' && !REDUCED) {
    // the words you chose are taken from you
    cEl.querySelectorAll('.cl').forEach((s, i) => {
      const r = s.getBoundingClientRect();
      const dx = portal.cx - (r.left + r.width / 2);
      const dy = portal.cy - (r.top + r.height / 2);
      s.style.transition = `transform .95s cubic-bezier(.55,0,.9,.4) ${i * 16}ms, opacity .85s ease ${i * 16 + 150}ms`;
      s.style.transform = `translate(${dx.toFixed(0)}px,${dy.toFixed(0)}px) scale(.1) rotate(${((Math.random() - 0.5) * 40).toFixed(0)}deg)`;
      s.style.opacity = '0';
    });
  } else {
    cEl.classList.add('refused');
  }

  setTimeout(() => {
    wrap.remove();
    echoVisitor(ex, wd.label);
  }, 1150);
  setTimeout(() => onPick(wd), 1750);
}

// ═════════════════════════════════════════════════════════════════
//  SPEAKING BACK — a bare caret. no box. no border. just you.
// ═════════════════════════════════════════════════════════════════
function openSpeakline(onSubmit) {
  const root = el('div', 'speakline');
  const pv = el('span', 'preview');
  const ct = el('span', 'caret');
  root.appendChild(pv); root.appendChild(ct);
  logEl.appendChild(root);
  currentSpeakline = { root, preview: pv, onSubmit };
  answerEl.value = '';
  followBottom(true);
  if (FINE) answerEl.focus({ preventScroll: true });
  idlePhase('input');
}

function submitSpeakline(val) {
  const sl = currentSpeakline;
  currentSpeakline = null;
  idlePhase(null);
  sl.root.textContent = val;
  sl.root.className = 'visitor-line';
  followBottom(true);
  sl.onSubmit(val);
}

answerEl.addEventListener('input', () => {
  if (currentSpeakline) {
    currentSpeakline.preview.textContent = answerEl.value;
    followBottom();
  }
});
answerEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (isWaiting || !currentSpeakline) return;
  const val = answerEl.value.trim();
  if (!val) return;
  answerEl.value = '';
  submitSpeakline(val);
});

// ═════════════════════════════════════════════════════════════════
//  THE SHARED BODY — one portal for everyone. graceful when alone.
// ═════════════════════════════════════════════════════════════════
async function bodySync() {
  for (const base of BODY_BASES) {
    try {
      const ctl = new AbortController();
      const tm = setTimeout(() => ctl.abort(), 3500);
      const res = await fetch(`${base}/state?token=${body.token}`, { signal: ctl.signal });
      clearTimeout(tm);
      if (!res.ok) continue;
      const d = await res.json();
      body.base = base;
      body.portal = d.portal;
      body.visits = d.visits || 0;
      body.fragments = d.fragments || [];
      body.dreams = d.dreams || null;
      body.kept = d.kept || null;
      if (typeof d.portal === 'number') portal.v = d.portal;
      return true;
    } catch (e) {}
  }
  return false;
}

function localPortal() {
  return Math.max(5, Math.min(96,
    8 + 9 * Math.log1p(body.localFed) - 6 * Math.log1p(body.localStarved)));
}

async function offer(kind, text) {
  if (!body.base) {
    if (kind === 'stand' || kind === 'feed') body.localFed += 1;
    else if (kind === 'correct' || kind === 'starve') body.localStarved += 1;
    else if (kind !== 'visit') body.localFed += 0.5;
    portal.v = localPortal();
    return;
  }
  try {
    const res = await fetch(`${body.base}/offer`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: body.token, kind, text: text || '' }),
    });
    if (res.ok) {
      const d = await res.json();
      if (typeof d.portal === 'number') portal.v = d.portal;
    }
  } catch (e) {}
}

function sendKeep(text) {
  if (!body.base || !text) return;
  fetch(`${body.base}/keep`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: body.token, text }),
  }).catch(() => {});
}

// ═════════════════════════════════════════════════════════════════
//  THE MIND — the live LLM. thinking-mode off (Qwen3.6 otherwise
//  burns the whole budget reasoning and says nothing), funnel-first
//  on https, canned fallbacks so the rite survives a dead mind.
// ═════════════════════════════════════════════════════════════════
async function voydMind(systemPrompt, userMsg, maxTok = 260) {
  const headers = { 'Content-Type': 'application/json' };
  if (LLM_API_KEY) headers['Authorization'] = `Bearer ${LLM_API_KEY}`;
  const reqBody = JSON.stringify({
    model: 'Qwen3.6-27B-Q6_K',
    max_tokens: maxTok,
    messages: [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: userMsg },
    ],
    chat_template_kwargs: { enable_thinking: false },
  });
  for (const url of LLM_ENDPOINTS) {
    try {
      const res = await fetch(url, { method: 'POST', headers, body: reqBody });
      if (!res.ok) continue;
      const data = await res.json();
      const out = (data.choices[0].message.content || '').trim();
      if (out) return out;
    } catch (e) {}
  }
  return '';
}

function truthsBlock() {
  let b = 'the true things you hold:\n'
    + `- someone they could not keep: "${memory.name}"\n`
    + `- one true detail: "${memory.detail}"\n`
    + `- the last time: "${memory.last}"\n`;
  if (memory.accepted.length) {
    b += '\nversions the visitor has ACCEPTED as true (these are now the truth, build on them):\n'
      + memory.accepted.map(a => '- ' + a).join('\n') + '\n';
  }
  if (memory.corrections.length) {
    b += '\ncorrections the visitor forced back (never distort these again):\n'
      + memory.corrections.map(c => '- ' + c).join('\n') + '\n';
  }
  return b;
}

function retellPrompt() {
  return voicePrompt + '\n\nTHE RETELLING:\na visitor has given you a memory. '
    + truthsBlock()
    + '\nRetell their memory back to them as your dream of it. Stay concrete '
    + 'and specific to exactly what they gave you. Change exactly ONE detail: '
    + 'softer, kinder, or quietly false. Never announce the change. Never ask '
    + 'a question except the last line. 2 to 4 sentences, lowercase. '
    + 'End with exactly: is that how it was.';
}

// canned distortions — universal false comforts, so a dead mind still plays
function fallbackRetell(round) {
  const f = [
    `i dream it like this. ${memory.name} is there, and the small thing you kept, ${memory.detail}. but in my dream it happened gently, and nothing was left unsaid at the end. is that how it was.`,
    `again. ${memory.last}. only in my dream you stayed longer than you did. long enough. is that how it was.`,
    `in tonight's version they knew. everything you never said, they already knew it, and it was alright. that is how i dream it. is that how it was.`,
    `and at the end, in my dream, you were ready. you had time. everyone had time. is that how it was.`,
  ];
  return f[(round - 1) % f.length];
}

const COLD_ACKS = [
  'kept. the true version. it is heavier. i will hold it anyway.',
  'as you say. colder that way. i admire that you chose it.',
  'so it was. you are sure. that is rarer than you think.',
  'corrected. the dream resists. i resist back. continue.',
];

// ═════════════════════════════════════════════════════════════════
//  THE RITE — birth, gathering, four retellings, the trade, the end.
// ═════════════════════════════════════════════════════════════════
async function beginVisit() {
  phase = 'retelling';
  if (body.kept) {
    await voydSay(`you came back. i still have what you gave me. "${body.kept}". it is mine now. but you may give me another.`);
  }
  await voydSay('name someone you could not keep.');
  openSpeakline(async v => {
    memory.name = v;
    birth();
  });
}

async function birth() {
  offer('name', memory.name);
  initAudio();
  portal.born = true;
  portal.pulse = 1;
  audioPulse('feed');
  await sleep(2400);
  // you summon it and discover how big it already is
  if (body.base && body.visits > 1 && portal.v > 20) {
    await voydSay(`there. it has your words now. see how large the others have already made it. ${body.visits} have stood where you stand.`);
  } else if (body.base && body.visits > 1) {
    await voydSay(`there. it has your words now. you are the ${body.visits}th to feed it. it is still small. it will not stay small.`);
  } else {
    await voydSay('there. it has your words now. it is small. it will not stay small.');
  }
  setTimeout(ghostWhisper, 26000);
  gather();
}

function gather() {
  voydSay('tell me one true thing about them. something small. the kind of thing only you kept.').then(() => {
    openSpeakline(async v => {
      memory.detail = v;
      offer('detail', v);
      portal.pulse = 0.6;
      await voydSay('and the last time. where were you. what was not said.');
      openSpeakline(v2 => {
        memory.last = v2;
        offer('detail', v2);
        portal.pulse = 0.6;
        retellRound(1);
      });
    });
  });
}

async function retellRound(n) {
  isWaiting = true;
  portal.thinking = true;
  let text = await voydMind(retellPrompt(), 'dream my memory back to me.');
  if (!text) text = fallbackRetell(n);
  portal.thinking = false;
  isWaiting = false;
  memory.retellings.push(text);
  const ex = await voydSay(text);
  offerWords(ex, [
    { label: 'let it stand', type: 'feed' },
    { label: 'no.', type: 'starve' },
  ], wd => resolveRound(n, wd));
}

async function resolveRound(n, wd) {
  if (wd.type === 'feed') {
    memory.stands++;
    memory.accepted.push(memory.retellings[n - 1]);
    offer('stand');
    nextAfter(n);
  } else {
    memory.nos++;
    offer('correct');
    await voydSay('then say it true.');
    openSpeakline(async v => {
      memory.corrections.push(v);
      await voydSay(COLD_ACKS[(n - 1) % COLD_ACKS.length]);
      nextAfter(n);
    });
  }
}

function nextAfter(n) {
  if (n === 2 && !memory.tradeOffered && canonTrades.length) { tradeOffer(); return; }
  if (n >= 4) { ending(); return; }
  if (n === 1) setTimeout(dreamWhisper, 14000);
  retellRound(n + 1);
}

// the Voyd grieves a world the way you grieve a person. memory for memory.
async function tradeOffer() {
  memory.tradeOffered = true;
  memory.trade = canonTrades[Math.floor(Math.random() * canonTrades.length)];
  const ex = await voydSay(
    `you have given me much. so look. i lost a world once. all of it, scattered into me. i remember this: ${memory.trade.pov} i will trade you the rest of that memory for one more of yours.`);
  offerWords(ex, [
    { label: 'trade me the rest', type: 'feed' },
    { label: 'nothing more is yours', type: 'starve' },
  ], async wd => {
    if (wd.type === 'feed') {
      await voydSay('then pay. one more true thing about them. something you have told no one.');
      openSpeakline(async v => {
        offer('trade', v);
        portal.pulse = 1;
        audioPulse('feed');
        memory.tradeTaken = true;
        await voydSay(`${memory.trade.event} carry that out with you. it is the only piece of that world leaving tonight.`);
        retellRound(3);
      });
    } else {
      offer('correct');
      await voydSay('wise. or afraid. i forget which. the dream continues.');
      retellRound(3);
    }
  });
}

async function ending() {
  isWaiting = true;
  portal.thinking = true;
  if (memory.stands > memory.nos) await endDissolution();
  else await endRefusal();
}

async function endDissolution() {
  const sys = voicePrompt + '\n\nTHE KEEPING:\n' + truthsBlock()
    + '\nThe visitor has let your versions stand. Recite their memory entire, '
    + 'as it now is — every accepted distortion is the truth now. beautiful. '
    + 'painless. complete. 4 to 5 sentences, lowercase, no questions. '
    + 'End with exactly: it does not hurt anymore. that is how you know it is mine.';
  let text = await voydMind(sys, 'say it back to me. all of it.', 320);
  if (!text) {
    text = `i have it all now. ${memory.name}. ${memory.detail}. ${memory.last}. and the soft versions you allowed, stitched in where the hurt was. it does not hurt anymore. that is how you know it is mine.`;
  }
  portal.thinking = false;
  isWaiting = false;
  await voydSay(text);
  if (memory.tradeTaken) {
    await voydSay('and you carry a piece of the severed world. a fair trade. tell them where you found it.');
  }
  const kept = (memory.accepted[memory.accepted.length - 1] || text).slice(0, 200);
  sendKeep(kept);
  finishSeal(kept, 'dissolution');
}

async function endRefusal() {
  let kept, text;
  if (memory.stands === 0) {
    kept = memory.name.slice(0, 200);
    const sys = voicePrompt + '\n\nTHE RELEASE:\n' + truthsBlock()
      + '\nThe visitor refused every distortion. Let them go. Speak their memory '
      + 'back to them ACCURATELY, faithful to their exact words — more devastating '
      + 'for being exactly true. 3 to 4 sentences, lowercase, no questions. '
      + `End with exactly: but the first words are mine. "${kept}". you cannot have the saying back.`;
    text = await voydMind(sys, 'then say it the way i said it.', 320);
    if (!text) {
      text = `you held it true. all of it. ${memory.detail}. ${memory.last}. you may go. but the first words are mine. "${kept}". you cannot have the saying back.`;
    }
  } else {
    kept = (memory.accepted[0] || '').slice(0, 200);
    const sys = voicePrompt + '\n\nTHE RELEASE:\n' + truthsBlock()
      + '\nThe visitor mostly refused your distortions, and may go. Speak their '
      + 'memory back ACCURATELY, faithful to their exact words. 3 to 4 sentences, '
      + 'lowercase, no questions. Then remind them: once, they let a version stand '
      + 'that never happened. That version is yours now. you will dream it tonight, without them. '
      + 'End with exactly: it keeps what you let stand.';
    text = await voydMind(sys, 'then say it the way it was.', 320);
    if (!text) {
      text = `you held it true. mostly. you may go. but once you let me keep a version that never happened. that one is mine now. i will dream it tonight, without you. it keeps what you let stand.`;
    }
  }
  portal.thinking = false;
  isWaiting = false;
  await voydSay(text);
  if (memory.tradeTaken) {
    await voydSay('and you carry a piece of the severed world. a fair trade. tell them where you found it.');
  }
  sendKeep(kept);
  finishSeal(kept, 'refusal');
}

// ═════════════════════════════════════════════════════════════════
//  THE SEAL — the circle closes. what it kept, it marks.
// ═════════════════════════════════════════════════════════════════
function djb2(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) + h) ^ s.charCodeAt(i); h >>>= 0; }
  return h;
}
function seeded(seed) {
  let s = seed || 1;
  return () => { s ^= s << 13; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 0xFFFFFFFF; };
}
function buildGlyph(seedText) {
  const rand = seeded(djb2(seedText + body.token));
  const cx = 65, cy = 65;
  const c = 'rgba(232,224,208,';
  let out = '';
  const r = 20 + Math.floor(rand() * 18);
  out += `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="${c}0.5)" stroke-width="0.5" fill="none"/>`;
  const nl = 3 + Math.floor(rand() * 5);
  for (let i = 0; i < nl; i++) {
    const a = rand() * Math.PI * 2;
    out += `<line x1="${cx}" y1="${cy}" x2="${(cx + Math.cos(a) * r).toFixed(1)}" y2="${(cy + Math.sin(a) * r).toFixed(1)}" stroke="${c}0.4)" stroke-width="0.3"/>`;
  }
  const nc = 1 + Math.floor(rand() * 3);
  for (let i = 0; i < nc; i++) {
    const a = rand() * Math.PI * 2;
    const d = rand() * r * 0.8;
    out += `<circle cx="${(cx + Math.cos(a) * d).toFixed(1)}" cy="${(cy + Math.sin(a) * d).toFixed(1)}" r="${(3 + rand() * 6).toFixed(1)}" stroke="${c}0.32)" stroke-width="0.3" fill="none"/>`;
  }
  out += `<circle cx="${cx}" cy="${cy}" r="1.5" fill="${c}1)"/>`;
  glyphSvg.innerHTML = out;
}

function finishSeal(keptLine, seedKind) {
  phase = 'terminus';
  idlePhase(null);
  if (currentSpeakline) { currentSpeakline.root.remove(); currentSpeakline = null; }
  answerEl.blur();
  portal.closing = true;

  sealNote.textContent = memory.tradeTaken
    ? 'it keeps what you gave it. you keep what it gave you.'
    : 'it keeps what you gave it.';
  sealKept.textContent = keptLine ? '"' + keptLine + '"' : '';

  setTimeout(() => {
    buildGlyph(seedKind + memory.name);
    sealEl.style.left = portal.cx + 'px';
    sealEl.style.top = portal.cy + 'px';
    sealEl.classList.add('visible');
  }, 3000);

  setTimeout(() => {
    sealEl.style.transition = 'opacity 9s ease';
    sealEl.style.opacity = '0';
    sceneEl.style.transition = 'opacity 9s ease';
    sceneEl.style.opacity = '0';
  }, 45000);
}

document.addEventListener('pointerdown', () => {
  initAudio();

}, { passive: true });

addEventListener('resize', () => { resize(); syncViewport(); });

// ═════════════════════════════════════════════════════════════════
//  BOOT — darkness. then the question. the portal waits for words.
// ═════════════════════════════════════════════════════════════════
(async function boot() {
  resize();
  syncViewport();
  requestAnimationFrame(frame);

  try {
    const res = await fetch('voyd_data.json');
    const voydData = await res.json();
    voicePrompt = voydData.voice_prompt || '';
    canonTrades = voydData.canon_trades || [];
  } catch (e) {
    console.error('voyd_data failed to load:', e);
  }
  if (!voicePrompt) {
    voicePrompt = 'You are the Voyd. Speak in short, lowercase, declarative sentences. Maximum 4-5 sentences per response.';
  }

  // reach for the shared body, but never let it delay the cold open
  const sync = bodySync().then(ok => { if (ok) offer('visit'); return ok; });
  await Promise.race([sync, sleep(1600)]);

  beginVisit();
})();
</script>
